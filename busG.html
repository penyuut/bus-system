<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Locations: Bus G</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffcfb3;
      font-family: 'Comic Sans MS', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-container {
      background-color: #000000;
      color: white;
      border-radius: 30px;
      width: 90%;
      max-width: 400px;
      margin-top: 20px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .map-container {
      margin: 10px auto;
      border-radius: 15px;
      overflow: hidden;
    }

    .map-container img {
      width: 100%;
      height: auto;
      border-radius: 15px;
    }

    .updated {
      margin-top: 10px;
      font-size: 12px;
      font-weight: bold;
    }

    .route-box {
      background-color: #ffcfb3;
      color: black;
      border-radius: 15px;
      padding: 10px;
      margin-top: 15px;
    }

    .route-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 14px;
    }

    .route-data {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-top: 4px;
    }

    .bottom-buttons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .home-btn, .help-btn, .info-btn {
      background: #ffffff;
      border: none;
      border-radius: 15px;
      padding: 8px 16px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
    }

    .help-btn {
      font-size: 12px;
      font-weight: bold;
      gap: 5px;
    }

    .help-btn:hover,
    .home-btn:hover,
    .info-btn:hover {
      background-color: #f2f2f2;
    }

    .popup {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -30%);
      background-color: #fff8e1;
      border: 2px solid #ff0000;
      border-radius: 15px;
      padding: 20px;
      width: 80%;
      max-width: 300px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      text-align: center;
      z-index: 999;
      font-family: 'Comic Sans MS', sans-serif;
    }

    .popup p {
      color: #d00000;
      font-weight: bold;
    }

    .popup button {
      margin-top: 10px;
      background-color: #f44336;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <h1>LOCATIONS : BUS G</h1>

    <div class="map-container">
      <img src="bus-map.png" alt="Bus GPS Animation">
    </div>

    <div class="updated">LAST UPDATED : 1 MIN AGO</div>

    <!-- Route Boxes -->
    <div class="route-box">
      <div class="route-header">
        <span>DEPARTURE</span>
        <span>ARRIVAL</span>
      </div>
      <div class="route-data">
        <span>8:00 AM</span>
        <span>8:25 AM</span>
      </div>
      <div class="route-data">
        <span>Hentian Perindu</span>
        <span>Hentian Seroja</span>
      </div>
    </div>

    <div class="route-box">
      <div class="route-header">
        <span>DEPARTURE</span>
        <span>ARRIVAL</span>
      </div>
      <div class="route-data">
        <span>8:25 AM</span>
        <span>8:45 AM</span>
      </div>
      <div class="route-data">
        <span>Hentian Seroja</span>
        <span>Hentian FSKM</span>
      </div>
    </div>

    <!-- Bottom Buttons -->
    <div class="bottom-buttons">
      <button class="home-btn" onclick="window.location.href='index.html'">🏠</button>
      <button class="info-btn" onclick="window.location.href='delay-info-busG.html'">ℹ️</button>
      <button class="help-btn" onclick="window.location.href='help.html'">💬 HELP</button>
    </div>

    <!-- Delay Popup -->
    <div id="delay-popup" style="display: none;" class="popup">
      <p><strong>⚠️Bus to Hentian Perindu delayed⚠️
New ETA: 8.00 AM</strong></p>
      <button onclick="closePopup()">OK</button>
    </div>
  </div>

 <!-- JavaScript at the bottom -->
  <script>
    const isBusDelayed = true;

    function closePopup() {
      document.getElementById("delay-popup").style.display = "none";
    }

    window.onload = function () {
      if (isBusDelayed) {
        document.getElementById("delay-popup").style.display = "block";
      }
    };
  </script>
</body>
</html>
