<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Locations: Bus F</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #b7e0ff;
      font-family: 'Comic Sans MS', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-container {
      background-color: #000000;
      color: white;
      border-radius: 30px;
      width: 90%;
      max-width: 400px;
      margin-top: 20px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .map-container {
      position: relative;
      margin: 10px auto;
      border-radius: 15px;
      overflow: hidden;
    }

    .map-container img {
      width: 100%;
      height: auto;
      border-radius: 15px;
    }

    .map-note {
      position: absolute;
      top: 5px;
      left: 10px;
      background: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: bold;
      color: red;
    }

    .updated {
      margin-top: 10px;
      font-size: 12px;
      font-weight: bold;
    }

    .route-box {
      background-color: #b7e0ff;
      color: black;
      border-radius: 15px;
      padding: 10px;
      margin-top: 15px;
    }

    .route-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 14px;
    }

    .route-data {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-top: 4px;
    }

    .bottom-buttons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .home-btn, .help-btn, .info-btn {
      background: #ffffff;
      border: none;
      border-radius: 15px;
      padding: 8px 16px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
    }

    .help-btn {
      font-size: 12px;
      font-weight: bold;
      gap: 5px;
    }

    .help-btn:hover, .home-btn:hover {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <h1>LOCATIONS : BUS F</h1>

    <div class="map-container">
      <img src="bus-map.png" alt="Bus GPS Animation">
    </div>

    <div class="updated">LAST UPDATED : 1 MIN AGO</div>

    <!-- Route 1 -->
    <div class="route-box">
      <div class="route-header">
        <span>DEPARTURE</span>
        <span>ARRIVAL</span>
      </div>
      <div class="route-data">
        <span>8:10 AM</span>
        <span>8:30 AM</span>
      </div>
      <div class="route-data">
        <span>Fakulti Kejuruteraan Elektrik</span>
        <span>Masjid UPM</span>
      </div>
    </div>

    <!-- Route 2 -->
    <div class="route-box">
      <div class="route-header">
        <span>DEPARTURE</span>
        <span>ARRIVAL</span>
      </div>
      <div class="route-data">
        <span>8:30 AM</span>
        <span>8:45 AM</span>
      </div>
      <div class="route-data">
        <span>Masjid UPM</span>
        <span>Fakulti Perubatan</span>
      </div>
    </div>

    <!-- Bottom Buttons -->
    <div class="bottom-buttons">
      <button class="home-btn" onclick="window.location.href='index.html'">🏠</button>
<button class="info-btn" onclick="window.location.href='delay-info-busF.html'">ℹ️</button>
      <button class="help-btn" onclick="window.location.href='help.html'">
        💬 HELP
      </button>
    </div>
  </div>
</body>
</html>
